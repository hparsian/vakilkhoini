name: verify deploy

# After every push to main, rebuild the project and check that the live site is
# actually serving that build (same asset file names + same bytes). Cloudflare
# may need a moment to finish its own build, so the check polls for a while.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compare live site with this build
        run: npm run verify:deploy -- --wait 420 --interval 15
